services:
  pzserver:
    container_name: project-zomboid-dedicated-server
    image: docker.io/zicstardust/project-zomboid-dedicated-server:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      BUILD: ${BUILD:-stable}
      SERVER_NAME: ${SERVER_NAME:-server}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ps4}
      STEAM: ${STEAM:-true}
      MAX_RAM: ${MAX_RAM:-8g}
      DISABLE_MOD_DOWNLOADER: ${DISABLE_MOD_DOWNLOADER:-false}
      DISABLE_CACHE: ${DISABLE_CACHE:-false}
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      # - "27015:27015"
    volumes:
      - ./data:/data
      - ./cache:/cache
